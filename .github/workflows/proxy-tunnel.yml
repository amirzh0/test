name: SOCKS5 Proxy for Telegram
on: 
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install dante-server
        run: |
          sudo apt-get update
          sudo apt-get install -y dante-server
          
      - name: Configure SOCKS5 proxy
        run: |
          sudo bash -c 'cat > /etc/danted.conf << EOF
          logoutput: /var/log/danted.log
          internal: 0.0.0.0 port = 1080
          external: eth0
          socksmethod: none
          client pass {
            from: 0.0.0.0/0 to: 0.0.0.0/0
            log: error
          }
          socks pass {
            from: 0.0.0.0/0 to: 0.0.0.0/0
            protocol: tcp udp
          }
          EOF'
          
      - name: Start SOCKS5 proxy
        run: |
          sudo danted
          sleep 3
          echo "SOCKS5 proxy running on port 1080"
          
      - name: Install bore
        run: |
          curl -L -o bore https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-x86_64-unknown-linux-musl
          chmod +x bore
          
      - name: Create tunnel
        run: |
          echo "==================="
          echo "SOCKS5 Proxy Details:"
          echo "==================="
          ./bore local 1080 --to bore.pub
